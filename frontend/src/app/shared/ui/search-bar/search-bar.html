<app-block>
  <div class="block">
    <div class="input-holder">
      <input class="input" type="text" [(ngModel)]="value" (keyup)="onChange()" (change)="onChange()">
    </div>
    @if (!autoSubmit()) {
      <div class="btn main" (click)="onSubmit()">
        <ng-icon size="2rem" [name]="Icons.Search"></ng-icon> <p>Search</p>
      </div>
    }
  </div>
  @if (filters()) {
    <div class="filters-holder">
      @for (filter of filters(); track filter) {
        <div class="filter">
          <app-select [isMultiple]="filter.multiple ?? false" [placeholder]="filter.label" [options]="filter.options" (valueChange)="onChangeValueFilter(filter.label, $event)"></app-select>
        </div>
      }
    </div>

  }
</app-block>
