<div class="header">
  <div class="block">
    <h1 style="color: var(--text-color-primary)">Games Management</h1>
    <h2>Configure games and their availability across locations</h2>
  </div>
  <div class="block">
    <div class="btn primary">
      <ng-icon [name]="Icons.Plus"></ng-icon>
      Create Game
    </div>
  </div>
</div>

<div class="sub-header">
  <app-block>
    <div class="header">
      <h2>Total Games</h2>
    </div>
    <div class="body">
      <h1 style="color: var(--text-color-primary); font-size: 2.5rem">24</h1>
    </div>
  </app-block>
  <app-block>
    <div class="header">
      <h2>Total Games</h2>
    </div>
    <div class="body">
      <h1 style="color: var(--text-color-primary); font-size: 2.5rem">24</h1>
    </div>
  </app-block>
  <app-block>
    <div class="header">
      <h2>Total Games</h2>
    </div>
    <div class="body">
      <h1 style="color: var(--text-color-primary); font-size: 2.5rem">24</h1>
    </div>
  </app-block>
  <app-block>
    <div class="header">
      <h2>Total Games</h2>
    </div>
    <div class="body">
      <h1 style="color: var(--text-color-primary); font-size: 2.5rem">24</h1>
    </div>
  </app-block>
</div>

<div class="content">
@for (game of games(); track game.id) {
  <app-game [data]="game"></app-game>
}
</div>
